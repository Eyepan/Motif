[package]
name = "motif-dsp"
version = "0.1.0"
edition = "2021"
description = "Portable DSP core for Motif: analysis and DJ mixing primitives behind a C ABI"
license = "UNLICENSED"
publish = false

[lib]
name = "motif_dsp"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["archive"]
# .zip reading for the Apple apps' Downloads import. Android reads zips with java.util.zip.
archive = ["dep:zip"]

[dependencies]
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
