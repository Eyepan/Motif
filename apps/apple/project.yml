# XcodeGen spec. Run `xcodegen` in this directory to produce Motif.xcodeproj.
name: Motif
options:
  bundleIdPrefix: app.motif
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MotifKit:
    path: .
targets:
  Motif:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    scheme: {}
    dependencies:
      - package: MotifKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.motif.Motif
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Motif
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readonly
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
    info:
      path: App/Info.plist
      properties:
        UIBackgroundModes: [audio]
        JAMENDO_CLIENT_ID: ""
