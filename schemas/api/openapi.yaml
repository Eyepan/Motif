# Motif sync API. Source of truth for the Apple and Android clients; the server
# in server/ implements it and its tests in server/tests/api.rs exercise it.
# Bump info.version on any change; breaking changes go under a new /v2 prefix.
openapi: 3.1.0
info:
  title: Motif sync API
  version: 0.3.0
servers:
  - url: http://localhost:8080
    description: motif-server on a developer machine
security:
  - bearer: []
paths:
  /health:
    get:
      summary: Liveness and database check
      security: []
      responses:
        "200": { description: Healthy, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
        "503": { description: Database unreachable, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /v1/auth/register:
    post:
      summary: Create an account with a username and password
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Credentials" } } }
      responses:
        "201": { description: Account created and signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/auth/login:
    post:
      summary: Sign in with a username and password
      description: An unknown username and a wrong password both return 401 with the same message. Ten wrong passwords in a row lock the username for 15 minutes (429).
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Credentials" } } }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/password:
    post:
      summary: Change the password
      description: Signs out every other session of this account and returns a new session for this device, keeping its device name. A wrong current password is 403, not 401, so it never looks like an expired token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200": { description: Password changed, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/auth/token:
    post:
      summary: Exchange a provider ID token for a Motif session
      description: Off unless the server is configured with Apple or Google audiences. Creates the account on first sign-in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, id_token]
              properties:
                provider: { type: string, enum: [apple, google, dev], description: "dev is accepted only when the server runs with MOTIF_DEV_AUTH" }
                id_token: { type: string }
                device: { $ref: "#/components/schemas/Device" }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/auth/refresh:
    post:
      summary: Rotate a refresh token
      description: Each refresh token works once. Store the new pair before using it. Presenting an already-rotated token (outside a 60 s retry window) signs out every device session from that sign-in.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } }
      responses:
        "200": { description: New session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      summary: Sign this device out
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } }
      responses:
        "204": { description: Signed out (also when the token was unknown) }
  /v1/auth/username:
    get:
      summary: Check a username while signing up
      security: []
      parameters:
        - { name: username, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The username is valid; `available` says whether it is free
          content:
            application/json:
              schema:
                type: object
                required: [username, available]
                properties:
                  username: { type: string, description: Normalized (lowercased) }
                  available: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
  /v1/me:
    get:
      summary: The signed-in account
      responses:
        "200": { description: Account, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Edit account details
      description: A missing field is left unchanged. `display_name` null or blank clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,31}$", description: "Case-insensitive. 400 for accounts without a password" }
                display_name: { type: [string, "null"], maxLength: 64 }
      responses:
        "200": { description: Updated account, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete the account
      description: Deletes the account, its synced history and every sign-in. Data on the devices is untouched. Access tokens already issued keep passing auth until they expire (at most 15 minutes), but every call then fails (404 on /v1/me, 401 on uploads).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, description: Required when the account has a password }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/sessions:
    get:
      summary: Devices signed in to this account
      description: Most recently used first. `last_used_at_ms` moves on each sign-in and token refresh, so it is accurate to about 15 minutes.
      responses:
        "200":
          description: Signed-in devices
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: { type: array, items: { $ref: "#/components/schemas/DeviceSession" } }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      summary: Sign out every other device
      description: Keeps the caller's sign-in. Returns 401 for an access token issued before device sessions existed; refresh and retry.
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                required: [signed_out]
                properties:
                  signed_out: { type: integer, description: How many devices were signed out }
        "401": { $ref: "#/components/responses/Error" }
  /v1/sessions/{id}:
    delete:
      summary: Sign out one device
      description: Its refresh token stops working at once; its current access token expires within 15 minutes. Signing out the caller's own id works like logout. Ids of other accounts are ignored.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Signed out (also when already signed out) }
        "401": { $ref: "#/components/responses/Error" }
  /v1/events:
    post:
      summary: Upload listening history events
      description: |
        Idempotent on event id: retrying a batch is always safe. Events in `inserted`
        or `duplicates` are acknowledged and the device marks them synced. Rejected
        events will never be accepted as sent; keep them locally and stop retrying them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/Event" } }
      responses:
        "200":
          description: Batch processed
          content:
            application/json:
              schema:
                type: object
                required: [inserted, duplicates, rejected]
                properties:
                  inserted: { type: integer }
                  duplicates: { type: integer }
                  rejected:
                    type: array
                    items:
                      type: object
                      required: [index, reason]
                      properties:
                        index: { type: integer, description: Position in the uploaded array }
                        id: { description: The event's id as sent, if it had one }
                        reason: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    get:
      summary: Pull events in server arrival order
      description: Start with no cursor, store next_cursor, and call again while has_more is true.
      parameters:
        - { name: after, in: query, schema: { type: string }, description: Opaque cursor from a previous pull }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
        - { name: exclude_device, in: query, schema: { type: string }, description: Skip events uploaded by this device_id }
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema:
                type: object
                required: [events, next_cursor, has_more]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/Event" } }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: Access token from /v1/auth/token, valid 15 minutes }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, enum: [bad_request, unauthorized, forbidden, not_found, conflict, too_many_requests, unavailable, internal] }
                  message: { type: string }
  schemas:
    Health:
      type: object
      required: [status, version, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        database: { type: string, enum: [ok, unreachable] }
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,31}$", description: Case-insensitive }
        password: { type: string, minLength: 8, description: At most 256 bytes }
        device: { $ref: "#/components/schemas/Device" }
    Device:
      description: The device signing in, shown in the list of signed-in devices. Optional.
      type: object
      properties:
        name: { type: string, description: "e.g. the system device name. Trimmed and cut to 64 characters" }
        platform: { type: string, enum: [ios, ipados, macos, android, other], description: Unknown values are stored as other }
    DeviceSession:
      type: object
      required: [id, created_at_ms, last_used_at_ms, current]
      properties:
        id: { type: string, format: uuid }
        device_name: { type: [string, "null"] }
        platform: { type: [string, "null"], enum: [ios, ipados, macos, android, other, null] }
        created_at_ms: { type: integer, format: int64, description: When this device signed in }
        last_used_at_ms: { type: integer, format: int64 }
        current: { type: boolean, description: This is the caller's own sign-in }
    Account:
      type: object
      required: [user_id, created_at_ms, identities]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: [string, "null"] }
        display_name: { type: [string, "null"], maxLength: 64 }
        created_at_ms: { type: integer, format: int64, description: Member since }
        identities:
          type: array
          items:
            type: object
            required: [provider]
            properties:
              provider: { type: string }
              email: { type: [string, "null"] }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    Session:
      type: object
      required: [user_id, access_token, token_type, expires_in, refresh_token]
      properties:
        user_id: { type: string, format: uuid }
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Seconds until the access token expires }
        refresh_token: { type: string, description: Store in the Keychain / Android Keystore. Valid 90 days. }
    Event:
      description: One history event, the same envelope as schemas/history.sql on the device (docs/analytics.md). Unknown fields are ignored.
      type: object
      required: [id, type, v, at_ms, tz_min, device_id, payload]
      properties:
        id: { type: string, format: uuid, description: UUIDv7 minted on the device }
        type: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$", examples: [play, track_added] }
        v: { type: integer, minimum: 1, description: Payload version for this type }
        at_ms: { type: integer, format: int64, description: Unix ms, UTC }
        tz_min: { type: integer, minimum: -1080, maximum: 1080, description: Local UTC offset in minutes }
        device_id: { type: string, minLength: 1, maxLength: 64 }
        session_id: { type: string, maxLength: 128 }
        track_id: { type: string, maxLength: 128 }
        track_key: { type: string, maxLength: 128, description: SHA-256 of the audio file content }
        payload: { type: object, description: "Per-type JSON, at most 16 KiB, validated by schemas/events/<type>.v<v>.schema.json" }
