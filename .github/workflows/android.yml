name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # updates the android-latest prerelease on main

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # PRs already ran lint and tests, and main only accepts PRs, so pushes to main just build and publish.
      - name: Lint JNI bindings
        if: github.event_name != 'push'
        run: cargo clippy --manifest-path dsp-jni/Cargo.toml -- -D warnings
      - name: Build DSP core for Android
        run: ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" scripts/build-dsp.sh
      - name: Unit tests
        if: github.event_name != 'push'
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build release APK
        env:
          # Optional: without it, Discover asks for a Jamendo client id the first time.
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Check the DSP core is packaged
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|x86_64)/libmotif_dsp_jni.so'
          cp "$APK" "motif-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: motif-android-${{ github.run_number }}
          path: apps/android/motif-${{ github.run_number }}.apk
          if-no-files-found: error
      - name: Publish android-latest prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest "motif-${{ github.run_number }}.apk" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Motif for Android (latest main)" \
            --notes "Release build of $GITHUB_SHA, signed with the development key. Open this page on your phone and tap the .apk to install."
