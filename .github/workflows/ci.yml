name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Each job below runs only when something it builds changed. Skipped jobs count as passing,
  # so they don't hold up merges. The Apple builds live in apple.yml.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      schemas: ${{ steps.filter.outputs.schemas }}
      dsp: ${{ steps.filter.outputs.dsp }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            schemas:
              - 'schemas/**'
              - 'tools/**'
              - '.github/workflows/ci.yml'
            dsp:
              - 'core/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - 'schemas/api/**'
              - '.github/workflows/ci.yml'

  schemas:
    needs: changes
    if: needs.changes.outputs.schemas == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check_migrations.py reads the v2 schema from history
      - run: python3 tools/check_migrations.py
      - run: python3 tools/check_genres.py

  dsp:
    needs: changes
    if: needs.changes.outputs.dsp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/dsp
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: motif
          POSTGRES_PASSWORD: motif
          POSTGRES_DB: motif
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgres://motif:motif@localhost:5432/motif
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            server/target
          key: server-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Release build of the Vercel function on Vercel's Rust version
        run: |
          rustup toolchain install 1.92 --profile minimal
          cargo +1.92 build --release --locked --bin motif
