name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check_migrations.py reads the v2 schema from history
      - run: python3 tools/check_migrations.py
      - run: python3 tools/check_genres.py

  dsp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/dsp
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: motif
          POSTGRES_PASSWORD: motif
          POSTGRES_DB: motif
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgres://motif:motif@localhost:5432/motif
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            server/target
          key: server-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Release build of the Vercel function
        run: cargo build --release --locked --bin motif

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build MotifDSP.xcframework
        run: core/dsp/scripts/build-apple.sh
      - name: MotifKit tests
        working-directory: apps/apple
        run: swift test
      - name: Generate Xcode project
        working-directory: apps/apple
        run: |
          brew install xcodegen
          xcodegen
      - name: Build app for macOS
        working-directory: apps/apple
        run: xcodebuild build -project Motif.xcodeproj -scheme Motif -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO
      - name: Build app for iOS Simulator
        working-directory: apps/apple
        run: xcodebuild build -project Motif.xcodeproj -scheme Motif -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
