name: Server migrations
# Applies server/migrations to the production database after a merge to main.
# Does nothing until the MOTIF_DATABASE_URL secret (Neon's direct, unpooled
# connection string) is set. Migrations must be additive: Vercel deploys the
# new code at the same time, and the old code keeps serving until it does.
on:
  push:
    branches: [main]
    paths: [server/migrations/**]
  workflow_dispatch:

concurrency: server-migrate

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.MOTIF_DATABASE_URL }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Check for the database secret
        id: secret
        run: echo "present=${{ env.DATABASE_URL_UNPOOLED != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.secret.outputs.present == 'true'
        run: cargo run --release --locked --bin motif-server migrate
